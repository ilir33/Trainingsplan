<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büro-Ausbildung – Übungsplan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');

  :root {
    --cream: #F5F2EC;
    --ink: #1A1A2E;
    --slate: #4A5568;
    --accent: #2D6A9F;
    --accent-light: #EBF4FF;
    --green: #276749;
    --green-light: #E6F4ED;
    --amber: #B7701F;
    --amber-light: #FEF3E2;
    --border: #E2DDD5;
    --done: #276749;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    background: var(--ink);
    color: var(--cream);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }

  header .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8899AA;
    margin-bottom: 0.5rem;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1.15;
    margin-bottom: 0.4rem;
  }

  header h1 em {
    font-style: italic;
    color: #90BDDF;
  }

  header p {
    font-size: 0.85rem;
    color: #8899AA;
    margin-top: 0.5rem;
  }

  /* Progress bar */
  .progress-wrap {
    background: var(--ink);
    padding: 0 1.5rem 1.5rem;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: #8899AA;
    margin-bottom: 0.4rem;
  }

  .progress-bar {
    height: 5px;
    background: #2A3550;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #90BDDF;
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  /* Week navigation */
  .week-nav {
    display: flex;
    gap: 0.4rem;
    padding: 1rem 1.5rem;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }

  .week-nav::-webkit-scrollbar { display: none; }

  .week-btn {
    flex-shrink: 0;
    padding: 0.35rem 0.85rem;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    background: white;
    color: var(--slate);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .week-btn.active {
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }

  .week-btn.completed {
    border-color: var(--green);
    color: var(--green);
  }

  /* Main content */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }

  .week-header {
    margin-bottom: 1.25rem;
  }

  .week-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--ink);
  }

  .week-subtitle {
    font-size: 0.82rem;
    color: var(--slate);
    margin-top: 0.2rem;
  }

  .week-theme {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.25rem 0.7rem;
    border-radius: 99px;
    margin-top: 0.6rem;
  }

  /* Day cards */
  .day-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.75rem;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .day-card.done {
    border-color: var(--green);
    background: var(--green-light);
  }

  .day-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.9rem 1rem;
    cursor: pointer;
  }

  .day-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--slate);
    flex-shrink: 0;
    transition: all 0.2s;
    background: white;
  }

  .day-card.done .day-dot {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }

  .day-info { flex: 1; }

  .day-name {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink);
  }

  .day-focus {
    font-size: 0.78rem;
    color: var(--slate);
    margin-top: 0.1rem;
  }

  .day-duration {
    font-size: 0.72rem;
    color: var(--slate);
    background: var(--cream);
    padding: 0.2rem 0.55rem;
    border-radius: 99px;
    border: 1px solid var(--border);
  }

  .day-card.done .day-duration {
    background: white;
    border-color: var(--green);
    color: var(--green);
  }

  /* Expanded tasks */
  .day-tasks {
    display: none;
    padding: 0 1rem 1rem;
    border-top: 1px solid var(--border);
  }

  .day-card.open .day-tasks { display: block; }
  .day-card.done .day-tasks { display: block; }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
  }

  .task-item:last-child { border-bottom: none; }

  .task-check {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: white;
  }

  .task-check.checked {
    background: var(--green);
    border-color: var(--green);
  }

  .task-check.checked::after {
    content: '✓';
    color: white;
    font-size: 11px;
    font-weight: 700;
  }

  .task-text { font-size: 0.83rem; line-height: 1.45; color: var(--ink); }

  .task-tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    margin-right: 0.3rem;
  }

  .tag-office { background: #DBEAFE; color: #1D4ED8; }
  .tag-schreiben { background: #FEE2E2; color: #B91C1C; }
  .tag-buch { background: #FEF3C7; color: #92400E; }
  .tag-komm { background: #F3E8FF; color: #6B21A8; }
  .tag-praxis { background: var(--green-light); color: var(--green); }

  /* Rest day */
  .rest-card {
    background: var(--cream);
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    color: var(--slate);
    font-size: 0.84rem;
  }

  .rest-icon { font-size: 1.2rem; }

  /* Tip box */
  .tip-box {
    background: var(--amber-light);
    border: 1.5px solid #F6D08A;
    border-radius: 10px;
    padding: 0.9rem 1rem;
    margin-top: 1.25rem;
    font-size: 0.82rem;
    color: var(--amber);
    line-height: 1.5;
  }

  .tip-box strong { display: block; margin-bottom: 0.3rem; font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; }

  /* Mark week done button */
  .mark-btn {
    width: 100%;
    margin-top: 1.25rem;
    padding: 0.85rem;
    border-radius: 10px;
    border: none;
    background: var(--ink);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .mark-btn:hover { background: #2A3550; }
  .mark-btn.done-btn { background: var(--green); }

  /* Resources */
  .resources {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .resources h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    margin-bottom: 0.9rem;
  }

  .resource-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--ink);
    font-size: 0.83rem;
  }

  .resource-item:last-child { border-bottom: none; }

  .resource-icon {
    width: 30px;
    height: 30px;
    background: var(--accent-light);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .resource-item a { color: var(--accent); text-decoration: underline; font-size: 0.75rem; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">PPC Training · Büro & Verwaltungsassistenz</div>

<main id="main-content"></main>

const tagMap = {
  office: { label: 'MS Office', cls: 'tag-office' },
  schreiben: { label: 'Schreiben', cls: 'tag-schreiben' },
  buch: { label: 'Buchhaltung', cls: 'tag-buch' },
  komm: { label: 'Kommunikation', cls: 'tag-komm' },
  praxis: { label: 'Praxis', cls: 'tag-praxis' },
};

// State
let state = JSON.parse(localStorage.getItem('uebungsplan') || '{}');
// state: { completedWeeks: [], checkedTasks: { 'w0d0t0': true } }
if (!state.completedWeeks) state.completedWeeks = [];
if (!state.checkedTasks) state.checkedTasks = {};

let currentWeek = 0;

function saveState() {
  localStorage.setItem('uebungsplan', JSON.stringify(state));
}

function updateProgress() {
  const count = state.completedWeeks.length;
  const pct = (count / 8) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = count + ' von 8 Wochen';
}

function renderNav() {
  const nav = document.getElementById('week-nav');
  nav.innerHTML = '';
  weeks.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-btn' + (i === currentWeek ? ' active' : '') + (state.completedWeeks.includes(i) ? ' completed' : '');
    btn.textContent = 'Woche ' + (i + 1);
    btn.onclick = () => { currentWeek = i; renderAll(); };
    nav.appendChild(btn);
  });
}

function renderMain() {
  const w = weeks[currentWeek];
  const isCompleted = state.completedWeeks.includes(currentWeek);
  const main = document.getElementById('main-content');

  let html = `
    <div class="week-header">
      <div class="week-title">${w.title}</div>
      <div class="week-subtitle">Montag bis Freitag · täglich 30–60 Minuten</div>
      <div class="week-theme">${w.theme}</div>
    </div>
  `;

  w.days.forEach((day, di) => {
    const taskKeys = day.tasks.map((_, ti) => `w${currentWeek}d${di}t${ti}`);
    const allChecked = taskKeys.every(k => state.checkedTasks[k]);
    const anyOpen = taskKeys.some(k => state.checkedTasks[k]);
    const isDone = isCompleted || allChecked;

    html += `<div class="day-card ${isDone ? 'done' : ''}" id="card-${di}">
      <div class="day-header" onclick="toggleCard(${di})">
        <div class="day-dot">${isDone ? '✓' : (di + 1)}</div>
        <div class="day-info">
          <div class="day-name">${day.name}</div>
          <div class="day-focus">${day.focus}</div>
        </div>
        <div class="day-duration">${day.duration}</div>
      </div>
      <div class="day-tasks">`;

    day.tasks.forEach((task, ti) => {
      const key = `w${currentWeek}d${di}t${ti}`;
      const checked = state.checkedTasks[key] ? 'checked' : '';
      const tag = tagMap[task.tag];
      html += `<div class="task-item">
        <div class="task-check ${checked}" onclick="toggleTask('${key}', ${di}, ${ti})" id="check-${key}"></div>
        <div class="task-text"><span class="task-tag ${tag.cls}">${tag.label}</span>${task.text}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  // Sunday rest
  html += `<div class="rest-card"><div class="rest-icon">😴</div><div><strong>Samstag & Sonntag</strong> – Wochenende! Erholen, wiederholen oder einfach frei lassen. Lernen braucht Pausen.</div></div>`;

  // Tip box
  html += `<div class="tip-box"><strong>💡 Tipp der Woche</strong>${w.tip}</div>`;

  // Mark button
  if (!isCompleted) {
    html += `<button class="mark-btn" onclick="markWeekDone()">✓ Woche ${currentWeek + 1} als erledigt markieren</button>`;
  } else {
    html += `<button class="mark-btn done-btn" onclick="unmarkWeek()">✓ Woche ${currentWeek + 1} abgeschlossen – Rückgängig?</button>`;
  }

  // Resources (only week 1)
  if (currentWeek === 0) {
    html += `<div class="resources">
      <h3>📚 Kostenlose Lernquellen</h3>
      <div class="resource-item"><div class="resource-icon">📖</div><div>Rechtschreibung prüfen – <a href="https://duden.de" target="_blank">duden.de</a></div></div>
      <div class="resource-item"><div class="resource-icon">📊</div><div>Excel Übungen auf Deutsch – <a href="https://bildungsbibel.de/excel-uebungen" target="_blank">bildungsbibel.de/excel-uebungen</a></div></div>
      <div class="resource-item"><div class="resource-icon">🎓</div><div>Microsoft Schulungen – <a href="https://support.microsoft.com" target="_blank">support.microsoft.com</a> → "Schulungen"</div></div>
      <div class="resource-item"><div class="resource-icon">✉️</div><div>Briefmuster Österreich – Google: "österreichischer Geschäftsbrief Muster"</div></div>
    </div>`;
  }

  main.innerHTML = html;
}

function renderAll() {
  renderNav();
  renderMain();
  updateProgress();
}

function toggleCard(di) {
  const card = document.getElementById('card-' + di);
  card.classList.toggle('open');
}

function toggleTask(key, di, ti) {
  state.checkedTasks[key] = !state.checkedTasks[key];
  saveState();
  renderAll();
  // Scroll to keep position
}

function markWeekDone() {
  if (!state.completedWeeks.includes(currentWeek)) {
    state.completedWeeks.push(currentWeek);
    saveState();
  }
  renderAll();
}

function unmarkWeek() {
  state.completedWeeks = state.completedWeeks.filter(w => w !== currentWeek);
  saveState();
  renderAll();
}

renderAll();
</script>
